[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kat-core"
version = "0.2.0"
description = "Persistent local KAT assistant service"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "openai-agents>=0.12,<1",
  "pydantic-settings>=2.6,<3",
  "python-dotenv>=1.0,<2",
  "httpx>=0.28,<1",
]

[project.scripts]
kat-core = "kat_core.__main__:main"

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8,<10",
    "pytest-asyncio>=0.24,<2",
    "ruff>=0.11,<1",
    "mypy>=1.15,<2",
    "pyinstaller>=6.12,<7",
    "playwright>=1.50,<2",
    "pywin32>=308 ; sys_platform == 'win32'",
]

[tool.hatch.build.targets.wheel]
packages = ["src/kat_core"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/kat_core"]
