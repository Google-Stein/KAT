name: Original Windows startup reproduction
on:
  push:
    branches: [investigation/windows-startup]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: '3.14.7'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@stable
      - name: Reproduce original uncertified interpreter selection
        shell: pwsh
        run: |
          # Diagnostic branch only: reproduce the original build's interpreter.
          foreach ($path in @('scripts/setup-windows.ps1', 'scripts/build-windows.ps1')) {
            (Get-Content $path -Raw).Replace('(3, 12)', '(3, 14)') | Set-Content $path
          }
          '3.14' | Set-Content .python-version
          '3.14' | Set-Content core/.python-version
      - name: Build packaged Windows executable
        shell: pwsh
        run: ./scripts/build-windows.ps1 -NoBundle -PythonExecutable '${{ steps.python.outputs.python-path }}'
      - name: Verify packaged desktop window and Core lifecycle
        shell: pwsh
        run: ./scripts/smoke-windows.ps1
      - name: Upload Windows startup diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kat-windows-diagnostics
          path: .local/windows-smoke/
          if-no-files-found: ignore
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: kat-windows-executable
          path: |
            desktop/src-tauri/target/release/kat-desktop.exe
            desktop/src-tauri/target/release/binaries/
