name: KAT checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Install uv and locked dependencies
        run: |
          python -m pip install uv
          uv sync --project core --python "$(command -v python)" --frozen --group dev
      - name: Test, lint, format, and type check
        working-directory: core
        run: |
          uv run pytest tests ../tests/integration
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy
      - name: Release metadata consistency
        run: python scripts/version.py --check
      - name: Real Core process smoke check
        run: python scripts/smoke-core.py
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install and check UI
        working-directory: desktop
        run: |
          npm ci
          npm test
          npm run lint
          npm run format:check
          npm run typecheck
          npm run build
      - uses: dtolnay/rust-toolchain@stable
      - name: Native lifecycle tests
        working-directory: desktop
        run: |
          cargo test --locked --manifest-path src-tauri/Cargo.toml --no-default-features
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
  windows:
    timeout-minutes: 45
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version-file: .python-version
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache locked Rust dependencies
        id: rust-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target/release
          key: kat-windows-cargo-v1-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: kat-windows-cargo-v1-
      - name: Rebuild application resources from current source
        shell: pwsh
        run: |
          cargo clean --manifest-path desktop/src-tauri/Cargo.toml -p kat-desktop --release
          if ($LASTEXITCODE -ne 0) { throw 'Could not clear app outputs before current-resource build.' }
      - name: Build Windows application and installer
        id: windows-build
        shell: pwsh
        run: ./scripts/build-windows.ps1 -PythonExecutable '${{ steps.python.outputs.python-path }}'
      - name: Save successfully built dependencies before runtime validation
        if: steps.windows-build.outcome == 'success' && steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target/release
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
      - name: Upload current executable for parallel diagnostics
        if: steps.windows-build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: kat-windows-executable
          path: |
            desktop/src-tauri/target/release/kat-desktop.exe
            desktop/src-tauri/target/release/binaries/
      - name: Windows Core and native integration tests
        shell: pwsh
        run: |
          ./tests/integration/test_windows_smoke_diagnostics.ps1
          & ./core/.venv/Scripts/python.exe -m pytest core/tests tests/integration -q
          if ($LASTEXITCODE -ne 0) { throw 'Windows Core tests failed.' }
          & ./core/.venv/Scripts/python.exe scripts/smoke-core.py --executable desktop/src-tauri/target/release/binaries/kat-core/kat-core.exe
          if ($LASTEXITCODE -ne 0) { throw 'Packaged Core smoke failed.' }
          $env:KAT_NATIVE_TEST_REPO = (Get-Location).Path
          cargo test --locked --manifest-path desktop/src-tauri/Cargo.toml --no-default-features
          if ($LASTEXITCODE -ne 0) { throw 'Windows native tests failed.' }
          cargo test --locked --manifest-path desktop/src-tauri/Cargo.toml --no-default-features -- --ignored --skip sleeper_fixture --skip launcher_fixture --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw 'Windows native Core integration tests failed.' }
      - name: Verify packaged desktop window and Core lifecycle
        shell: pwsh
        run: ./scripts/smoke-windows.ps1
      - name: Install, launch, persist, and uninstall
        shell: pwsh
        run: ./scripts/smoke-installed-windows.ps1 -LocalInference
      - name: Upload Windows startup diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kat-windows-diagnostics
          path: .local/windows-smoke/
          if-no-files-found: ignore
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: kat-windows-installer
          path: desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
