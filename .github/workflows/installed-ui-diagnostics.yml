name: Installed UI diagnostics
on:
  workflow_dispatch:
    inputs:
      executable_run:
        description: 'Optional KAT checks run artifact; empty tests released 0.1.1 credentials only'
        required: false
        default: ''
      core_only:
        description: 'Only real local Core/tool diagnosis; does not validate a desktop'
        required: false
        default: false
        type: boolean
permissions:
  contents: read
  actions: read
jobs:
  installed-ui:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Install locked test tooling and validated application
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          EXECUTABLE_RUN: ${{ inputs.executable_run }}
          CORE_ONLY: ${{ inputs.core_only }}
        run: |
          python -m pip install uv
          uv sync --project core --frozen --group dev
          if ($env:CORE_ONLY -eq 'true') {
            ./scripts/test-local-windows.ps1
          } elseif ($env:EXECUTABLE_RUN) {
            if ($env:EXECUTABLE_RUN -notmatch '^\d+$') { throw 'Expected a numeric run ID.' }
            gh run download $env:EXECUTABLE_RUN --name kat-windows-executable --dir .local/diagnostic-app
            if ($LASTEXITCODE -ne 0) { throw 'Could not download packaged application.' }
            ./scripts/test-local-windows.ps1 -Executable "$((Get-Location).Path)/.local/diagnostic-app/kat-desktop.exe"
          } else {
            gh release download v0.1.1 --pattern '*-setup.exe' --dir .local/diagnostic-installer
            if ($LASTEXITCODE -ne 0) { throw 'Could not download validated installer.' }
            $installer = (Get-ChildItem .local/diagnostic-installer -Filter '*.exe').FullName
            $install = Join-Path (Get-Location).Path '.local/diagnostic-install'
            Start-Process $installer -ArgumentList "/S /D=$install" -Wait
            & core/.venv/Scripts/python.exe scripts/smoke-installed-ui.py --executable "$install/kat-desktop.exe" --credentials-only
            if ($LASTEXITCODE -ne 0) { throw 'Installed credential UI diagnostic failed.' }
          }
      - name: Native diagnostic evidence
        if: always()
        shell: pwsh
        run: |
          $logs = Join-Path $env:LOCALAPPDATA 'com.kat.assistant/logs'
          if (Test-Path $logs) { Get-ChildItem $logs -Filter '*.log' | ForEach-Object { Get-Content $_.FullName -Tail 30 } }
          Get-NetTCPConnection -State Listen -ErrorAction SilentlyContinue | Where-Object LocalPort -eq 42800 | Select-Object LocalAddress,LocalPort,OwningProcess
          Get-CimInstance Win32_Process | Where-Object Name -in 'kat-desktop.exe','kat-core.exe','msedgewebview2.exe' | Select-Object Name,ProcessId,ParentProcessId
