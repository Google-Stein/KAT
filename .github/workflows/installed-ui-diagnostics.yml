name: Installed UI attachment diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  attach:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Install locked test tooling and validated released application
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m pip install uv
          uv sync --project core --frozen --group dev
          gh release download v0.1.1 --pattern '*-setup.exe' --dir .local/diagnostic-installer
          $installer = (Get-ChildItem .local/diagnostic-installer -Filter '*.exe').FullName
          $install = Join-Path (Get-Location).Path '.local/diagnostic-install'
          Start-Process $installer -ArgumentList "/S /D=$install" -Wait
          & core/.venv/Scripts/python.exe scripts/smoke-installed-ui.py --executable "$install/kat-desktop.exe" --startup-only
          if ($LASTEXITCODE -ne 0) { throw 'CDP attachment diagnostic failed.' }
      - name: Native diagnostic evidence
        if: always()
        shell: pwsh
        run: |
          $logs = Join-Path $env:LOCALAPPDATA 'com.kat.assistant/logs'
          if (Test-Path $logs) { Get-ChildItem $logs -Filter '*.log' | ForEach-Object { Get-Content $_.FullName -Tail 30 } }
          Get-NetTCPConnection -State Listen -ErrorAction SilentlyContinue | Where-Object LocalPort -in 42800,9527 | Select-Object LocalAddress,LocalPort,OwningProcess
          Get-CimInstance Win32_Process | Where-Object Name -in 'kat-desktop.exe','kat-core.exe','msedgewebview2.exe' | Select-Object Name,ProcessId,ParentProcessId
